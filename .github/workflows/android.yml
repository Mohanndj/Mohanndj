# «الوعي الشخصي» as an Android app: built, tried on an emulator, and published as a release (alwaei.apk) whenever
# the app's shell (android/) changes. The web app itself is not in it: the app opens the site, so it updates by itself.
# Without the key's password (the secret ANDROID_KEY_PASSWORD, which the owner writes in GitHub himself and nobody else
# sees) a trial build is made and tried, and nothing is published.
name: Android app

on:
  push:
    branches: [claude/task-collection-interface-dc758h]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.build.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        id: build
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::The secret ANDROID_KEY_PASSWORD is missing: a trial build only, not published"
            gradle -p android :app:assembleDebug -Pvc=${{ github.run_number }} --no-daemon --stacktrace
            cp android/app/build/outputs/apk/debug/app-debug.apk alwaei.apk
            echo "signed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ${#ANDROID_KEY_PASSWORD} -lt 12 ]; then echo "::error::ANDROID_KEY_PASSWORD is too short: 12 characters at least"; exit 1; fi
          KEY=android/app/alwaei.p12 ENC=android/app/alwaei.p12.enc
          if [ ! -f "$ENC" ]; then
            # the first signed build makes the app's key with the owner's password, and keeps it here locked by it
            # (pushed before anything is signed with it: an app signed by a key that is lost could never be updated)
            keytool -genkeypair -keystore "$KEY" -storetype PKCS12 -alias alwaei -keyalg RSA -keysize 3072 -validity 12000 \
              -dname "CN=Alwaei, O=Mohanndj" -storepass "$ANDROID_KEY_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD"
            openssl enc -aes-256-cbc -pbkdf2 -iter 2000000 -salt -in "$KEY" -out "$ENC" -pass env:ANDROID_KEY_PASSWORD
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ENC"
            git commit -m "Android app: its signing key, locked by the repository's secret"
            { git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; } || { echo "::error::The new key could not be kept"; exit 1; }
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 2000000 -in "$ENC" -out "$KEY" -pass env:ANDROID_KEY_PASSWORD 2>/dev/null \
              && keytool -list -keystore "$KEY" -storetype PKCS12 -storepass "$ANDROID_KEY_PASSWORD" > /dev/null \
              || { echo "::error::ANDROID_KEY_PASSWORD does not open the app's key (was the secret changed?)"; exit 1; }
          fi
          gradle -p android :app:assembleRelease -Pvc=${{ github.run_number }} --no-daemon --stacktrace
          cp android/app/build/outputs/apk/release/app-release.apk alwaei.apk
          echo "signed=1" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: alwaei-apk
          path: alwaei.apk
      # for checking the widget «اليوم» (android/ci-widget.sh): a test build whose page can be filled, and a home screen
      # of one widget (android/widgethost). Neither is published
      - name: Build the widget's check
        run: |
          gradle -p android :app:assembleDebug :widgethost:assembleDebug -Pvc=${{ github.run_number }} --no-daemon --stacktrace
          cp android/app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          cp android/widgethost/build/outputs/apk/debug/widgethost-debug.apk widgethost.apk
      - uses: actions/upload-artifact@v4
        with:
          name: widget-check
          path: |
            app-debug.apk
            widgethost.apk

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: alwaei-apk
      - uses: actions/download-artifact@v4
        with:
          name: widget-check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow websocket-client
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/ci-smoke.sh && bash android/ci-widget.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            smoke.log
            smoke.png
            w*.png
            w*.xml

  release:
    needs: [build, smoke]
    if: needs.build.outputs.signed == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: alwaei-apk
      # a copy on the site itself (https://mohanndj.github.io/Mohanndj/alwaei.apk, and the button in «الإعدادات»):
      # GitHub's own download link stopped at «جارٍ التنزيل» on the phone
      - name: Copy to the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alwaei.apk
          git commit -m "Android app ${{ github.run_number }}: its file on the site"
          git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "android-${{ github.run_number }}" alwaei.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "الوعي الشخصي لأندرويد، الإصدار ${{ github.run_number }}" \
            --notes "نزّل alwaei.apk على جوالك وثبّته. الرابط الثابت لآخر إصدار: https://github.com/${{ github.repository }}/releases/latest/download/alwaei.apk"
