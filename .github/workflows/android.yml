# «الوعي الشخصي» as an Android app: built, tried on an emulator, and published as a release (alwaei.apk) whenever
# the app's shell (android/) changes. The web app itself is not in it: the app opens the site, so it updates by itself.
# Without the key's password (the secret ANDROID_KEY_PASSWORD) a trial build is made and tried, and nothing is published.
name: Android app

on:
  push:
    branches: [claude/task-collection-interface-dc758h]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.build.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        id: build
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEY_PASSWORD" ]; then
            keytool -list -keystore android/app/alwaei.p12 -storetype PKCS12 -storepass "$ANDROID_KEY_PASSWORD" > /dev/null || { echo "::error::ANDROID_KEY_PASSWORD does not open the key"; exit 1; }
            gradle -p android assembleRelease -Pvc=${{ github.run_number }} --no-daemon --stacktrace
            cp android/app/build/outputs/apk/release/app-release.apk alwaei.apk
            echo "signed=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The secret ANDROID_KEY_PASSWORD is missing: a trial build only, not published"
            gradle -p android assembleDebug -Pvc=${{ github.run_number }} --no-daemon --stacktrace
            cp android/app/build/outputs/apk/debug/app-debug.apk alwaei.apk
            echo "signed=0" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: alwaei-apk
          path: alwaei.apk

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: alwaei-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/ci-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            smoke.log
            smoke.png

  release:
    needs: [build, smoke]
    if: needs.build.outputs.signed == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alwaei-apk
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "android-${{ github.run_number }}" alwaei.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "الوعي الشخصي لأندرويد، الإصدار ${{ github.run_number }}" \
            --notes "نزّل alwaei.apk على جوالك وثبّته. الرابط الثابت لآخر إصدار: https://github.com/${{ github.repository }}/releases/latest/download/alwaei.apk"
