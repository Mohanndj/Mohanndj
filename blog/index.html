<script>
/* الوضع الداكن قبل أي رسم، كي لا تومض الصفحة بيضاء لمن اختاره */
try{var t=localStorage.getItem("muhannad-theme");var d=t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.setAttribute("data-theme",d?"dark":"light")}catch(e){}
</script>
<style>
/* شاشة التهيئة: تظهر فقط إن تأخّر التحميل، ويستبدلها التطبيق فور جاهزيته */
html{background:#F2F1EC}html[data-theme=dark]{background:#12151A}
.boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  color:#B0873C;opacity:0;animation:boot-in .5s .35s ease forwards}
html[data-theme=dark] .boot{color:#C9A055}
.boot svg{width:58px;height:58px;animation:boot-turn 6s linear infinite}
.boot svg rect{fill:none;stroke:currentColor;stroke-width:1}
.boot svg circle{fill:currentColor;animation:boot-beat 1.6s ease-in-out infinite;transform-origin:12px 12px}
.boot p{margin:0;font-family:"Aref Ruqaa","Amiri",serif;font-size:26px;color:#1A1D22}
html[data-theme=dark] .boot p{color:#E6E3DA}
.boot p span{display:inline-block;animation:boot-dot 1.4s infinite;opacity:.2}
.boot p span:nth-child(2){animation-delay:.2s}.boot p span:nth-child(3){animation-delay:.4s}
@keyframes boot-in{to{opacity:1}}@keyframes boot-turn{to{transform:rotate(360deg)}}
@keyframes boot-beat{50%{transform:scale(1.6);opacity:.55}}@keyframes boot-dot{40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.boot svg,.boot svg circle,.boot p span{animation:none}.boot p span{opacity:1}}
</style>
</head>
<body>
<noscript><style>.boot{display:none}</style><p style="text-align:center;padding:40px 16px;font-family:Amiri,serif">يتطلّب تصفّح هذه المدونة تفعيل جافاسكربت.</p></noscript>
<div id="root"><div class="boot" role="status"><svg viewBox="2 2 20 20" aria-hidden="true"><rect x="5" y="5" width="14" height="14"/><rect x="5" y="5" width="14" height="14" transform="rotate(45 12 12)"/><circle cx="12" cy="12" r="1.6"/></svg><p>نهيئ لك المقالات<span>.</span><span>.</span><span>.</span></p></div></div>
<script type="module" src="/src/main.jsx"></script>
</body>
