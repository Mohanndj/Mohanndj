<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مهامي</title>
<meta name="description" content="مهامك وأهدافك اليومية ومنبهاتها وإحصائيات إنجازك في تطبيق واحد.">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مهامي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div>
      <h1 id="appTitle">مهامي</h1>
      <p class="sub" id="greeting"></p>
    </div>
    <button type="button" class="install" id="installBtn" hidden>تثبيت التطبيق</button>
  </div>
</header>

<main id="view" class="wrap" tabindex="-1"></main>

<button type="button" class="fab" data-action="new" aria-label="إضافة مهمة">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabbar" id="tabbar" aria-label="الأقسام">
  <button type="button" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v15H4zM4 9h16M8 3v4M16 3v4"/></svg><span>اليوم</span></button>
  <button type="button" data-tab="tasks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg><span>المهام</span></button>
  <button type="button" data-tab="goals"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 12h.01"/></svg><span>الأهداف</span></button>
  <button type="button" data-tab="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16h16M8 16v-4M12 16V8M16 16v-6"/></svg><span>الإحصائيات</span></button>
  <button type="button" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-6M5 10V4M12 20v-8M12 8V4M19 20v-4M19 12V4M2 14h6M9 8h6M16 16h6"/></svg><span>التخصيص</span></button>
</nav>

<div class="alarm" id="alarm" role="alertdialog" aria-live="assertive" hidden>
  <div class="alarm-text">
    <strong>منبه</strong>
    <span id="alarmTitle"></span>
  </div>
  <div class="alarm-actions">
    <button type="button" class="primary" data-action="alarm-done">تمت</button>
    <button type="button" data-action="alarm-snooze">غفوة 10 دقائق</button>
    <button type="button" data-action="alarm-dismiss">إغلاق</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <form id="editor" novalidate>
    <div class="sheet-head">
      <h2 id="sheetTitle">مهمة جديدة</h2>
      <button type="button" class="icon-btn" data-action="close-sheet" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <label class="field">
      <span>العنوان</span>
      <input type="text" id="fTitle" autocomplete="off" placeholder="مثال: مراجعة تقرير الشهر" required>
    </label>

    <div class="seg" id="fKind" role="group" aria-label="النوع">
      <button type="button" data-kind="once">مهمة لمرة واحدة</button>
      <button type="button" data-kind="repeat">هدف متكرر</button>
    </div>

    <div class="grid2">
      <label class="field">
        <span>الأولوية</span>
        <select id="fPriority">
          <option value="high">عالية</option>
          <option value="mid">متوسطة</option>
          <option value="low">منخفضة</option>
        </select>
      </label>
      <label class="field">
        <span>التصنيف</span>
        <input type="text" id="fCategory" list="cats" autocomplete="off" placeholder="عمل، بيت، صحة…">
      </label>
    </div>
    <datalist id="cats"></datalist>

    <div id="onceFields">
      <label class="field">
        <span>تاريخ الاستحقاق</span>
        <input type="date" id="fDue">
      </label>
    </div>

    <div id="repeatFields" class="stack" hidden>
      <div class="field">
        <span>أيام التكرار</span>
        <div class="days" id="fDays"></div>
      </div>
      <div class="grid2">
        <label class="field">
          <span>يبدأ من</span>
          <input type="date" id="fStart">
        </label>
        <label class="field">
          <span>ينتهي في</span>
          <input type="date" id="fUntil">
          <small class="hint">اتركه فارغاً ليستمر بلا نهاية</small>
        </label>
      </div>
    </div>

    <div class="grid2 alarm-row">
      <label class="field">
        <span>وقت المنبه</span>
        <input type="time" id="fTime">
      </label>
      <label class="switch">
        <input type="checkbox" id="fRemind">
        <span>تشغيل المنبه</span>
      </label>
    </div>

    <section class="notes" aria-labelledby="notesHead">
      <h3 id="notesHead">الملاحظات <span class="count" id="notesCount"></span></h3>
      <ul id="notesList"></ul>
      <label class="field">
        <span class="sr">ملاحظة جديدة</span>
        <textarea id="fNote" rows="3" placeholder="أضف ملاحظة… يمكنك إضافة ما تشاء من الملاحظات"></textarea>
      </label>
      <button type="button" class="ghost" data-action="add-note">إضافة الملاحظة</button>
    </section>

    <div class="sheet-actions">
      <button type="submit" class="primary">حفظ</button>
      <button type="button" class="ghost" data-action="ics" id="icsBtn">إضافة إلى تقويم الجوال</button>
      <button type="button" class="danger" data-action="delete-task" id="delBtn">حذف</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
