<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مهامي</title>
<meta name="description" content="مهامك وأهدافك اليومية ومنبهاتها وإحصائيات إنجازك في تطبيق واحد.">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مهامي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="top-text">
      <h1 id="appTitle">مهامي</h1>
      <p class="sub" id="greeting"></p>
    </div>
    <div class="top-actions">
      <button type="button" class="install" id="installBtn" hidden>تثبيت التطبيق</button>
      <button type="button" class="icon-btn gear" data-tab="settings" aria-label="التخصيص والإعدادات">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="view" class="wrap" tabindex="-1"></main>

<button type="button" class="fab" data-action="new" aria-label="إضافة مهمة">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabbar" id="tabbar" aria-label="الأقسام">
  <button type="button" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>اليوم</span></button>
  <button type="button" data-tab="tasks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg><span>المهام</span></button>
  <button type="button" data-tab="timer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM12 9v4l2.5 2M9.5 2h5M12 2v3M19 6l1.5-1.5"/></svg><span>المؤقت</span></button>
  <button type="button" data-tab="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v15H4zM4 9h16M8 3v4M16 3v4M8 13h.01M12 13h.01M16 13h.01M8 16.5h.01M12 16.5h.01"/></svg><span>التقويم</span></button>
  <button type="button" data-tab="goals"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 12h.01"/></svg><span>الأهداف</span></button>
  <button type="button" data-tab="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16h16M8 16v-4M12 16V8M16 16v-6"/></svg><span>الإحصائيات</span></button>
</nav>

<button type="button" class="timer-bar" id="timerBar" data-tab="timer" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM12 9v4l2.5 2M9.5 2h5"/></svg>
  <b id="timerBarClock">00:00</b><span id="timerBarTitle"></span>
</button>

<div class="alarm" id="alarm" role="alertdialog" aria-live="assertive" hidden>
  <div class="alarm-text">
    <strong id="alarmKicker">منبه</strong>
    <span id="alarmTitle"></span>
  </div>
  <div class="alarm-actions">
    <button type="button" class="primary" data-action="alarm-done">تمت</button>
    <button type="button" data-action="alarm-snooze">غفوة 10 دقائق</button>
    <button type="button" data-action="alarm-dismiss">إغلاق</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <form id="editor" novalidate>
    <div class="sheet-head">
      <h2 id="sheetTitle">مهمة جديدة</h2>
      <button type="button" class="icon-btn" data-action="close-sheet" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <label class="field">
      <span>العنوان</span>
      <input type="text" id="fTitle" autocomplete="off" placeholder="مثال: مراجعة تقرير الشهر" required>
    </label>

    <div class="seg" id="fKind" role="group" aria-label="النوع">
      <button type="button" data-kind="once">مهمة لمرة واحدة</button>
      <button type="button" data-kind="repeat">هدف متكرر</button>
    </div>

    <div class="grid2">
      <label class="field">
        <span>الأولوية</span>
        <select id="fPriority">
          <option value="high">عالية</option>
          <option value="mid">متوسطة</option>
          <option value="low">منخفضة</option>
        </select>
      </label>
      <label class="field">
        <span>التصنيف</span>
        <input type="text" id="fCategory" list="cats" autocomplete="off" placeholder="عمل، بيت، صحة…">
      </label>
    </div>
    <datalist id="cats"></datalist>

    <div id="onceFields">
      <label class="field">
        <span>التاريخ</span>
        <input type="date" id="fDue">
      </label>
    </div>

    <div id="repeatFields" class="stack" hidden>
      <div class="field">
        <span>أيام التكرار</span>
        <div class="days" id="fDays"></div>
      </div>
      <div class="grid2">
        <label class="field">
          <span>يبدأ من</span>
          <input type="date" id="fStart">
        </label>
        <label class="field">
          <span>ينتهي في</span>
          <input type="date" id="fUntil">
          <small class="hint">اتركه فارغاً ليستمر بلا نهاية</small>
        </label>
      </div>
      <div class="grid2">
        <label class="field">
          <span>العدد المطلوب يومياً</span>
          <input type="number" id="fTarget" min="1" max="999" inputmode="numeric" value="1">
        </label>
        <label class="field">
          <span>الوحدة</span>
          <input type="text" id="fUnit" autocomplete="off" placeholder="أكواب، صفحات، مرات…">
        </label>
      </div>
      <small class="hint">مثال: 8 أكواب ماء. اترك العدد 1 لهدف يُنجز بضغطة واحدة.</small>
    </div>

    <div class="field">
      <span>الوقت</span>
      <div class="seg" id="fTimeMode" role="group" aria-label="نوع الوقت">
        <button type="button" data-mode="none">بلا وقت</button>
        <button type="button" data-mode="clock">ساعة محددة</button>
        <button type="button" data-mode="prayer">حسب الصلاة</button>
      </div>
    </div>
    <label class="field" id="clockFields">
      <span class="sr">الساعة</span>
      <input type="time" id="fTime">
    </label>
    <div id="prayerFields" class="stack">
      <div class="grid3">
        <select id="fPrRel" aria-label="قبل أو بعد">
          <option value="before">قبل</option>
          <option value="at">مع أذان</option>
          <option value="after">بعد</option>
        </select>
        <select id="fPrName" aria-label="الصلاة">
          <option value="fajr">الفجر</option>
          <option value="sunrise">الشروق</option>
          <option value="dhuhr">الظهر</option>
          <option value="asr">العصر</option>
          <option value="maghrib">المغرب</option>
          <option value="isha">العشاء</option>
        </select>
        <select id="fPrMin" aria-label="بكم دقيقة">
          <option value="5">بـ 5 دقائق</option>
          <option value="10">بـ 10 دقائق</option>
          <option value="15">بربع ساعة</option>
          <option value="20">بـ 20 دقيقة</option>
          <option value="30">بنصف ساعة</option>
          <option value="45">بـ 45 دقيقة</option>
          <option value="60">بساعة</option>
          <option value="90">بساعة ونصف</option>
          <option value="120">بساعتين</option>
        </select>
      </div>
      <small class="hint" id="prayerHint"></small>
    </div>
    <div class="field" id="alarmField">
      <span>المنبهات <small class="hint">اختر واحداً أو أكثر</small></span>
      <div class="days" id="fAlarms"></div>
    </div>

    <section class="subsec" aria-labelledby="subsHead">
      <h3 id="subsHead">الخطوات <span class="count" id="subsCount"></span></h3>
      <ul id="subsList" class="subs"></ul>
      <div class="add-row">
        <input type="text" id="fSub" autocomplete="off" placeholder="أضف خطوة… (مثال: حجز التذاكر)" aria-label="خطوة جديدة">
        <button type="button" class="ghost" data-action="add-sub">إضافة</button>
      </div>
    </section>

    <section class="subsec" aria-labelledby="notesHead">
      <h3 id="notesHead">الملاحظات <span class="count" id="notesCount"></span></h3>
      <ul id="notesList"></ul>
      <label class="field">
        <span class="sr">ملاحظة جديدة</span>
        <textarea id="fNote" rows="3" placeholder="أضف ملاحظة… يمكنك إضافة ما تشاء من الملاحظات"></textarea>
      </label>
      <button type="button" class="ghost" data-action="add-note">إضافة الملاحظة</button>
    </section>

    <section class="subsec" id="timerSec" aria-labelledby="timerHead">
      <h3 id="timerHead">المؤقت</h3>
      <div class="row-between">
        <span class="note-text" id="timerTotal"></span>
        <button type="button" class="ghost" data-action="timer-for">ابدأ المؤقت لهذه المهمة</button>
      </div>
    </section>

    <div class="sheet-actions">
      <button type="submit" class="primary">حفظ</button>
      <button type="button" class="ghost" data-action="ics" id="icsBtn">إضافة إلى تقويم الجوال</button>
      <button type="button" class="danger" data-action="delete-task" id="delBtn">حذف</button>
    </div>
  </form>
</dialog>

<script src="timer-shared.js?v=6"></script>
<script src="prayer.js?v=6"></script>
<script src="nlp.js?v=6"></script>
<script src="app.js?v=6"></script>
<script>
  // Self-repair: if the page and its scripts come from different versions (an old offline copy),
  // clear the offline copy and reload once.
  (function () {
    var ok = typeof APP_VERSION !== 'undefined' && APP_VERSION === 6 && typeof TimerShared !== 'undefined' && typeof SmartParse !== 'undefined';
    var tried = false;
    try { tried = sessionStorage.getItem('mahami-repair') === '6'; } catch (e) {}
    if (ok || tried) return;
    try { sessionStorage.setItem('mahami-repair', '6'); } catch (e) {}
    var regs = navigator.serviceWorker ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]);
    regs.then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
      .then(function () { return window.caches ? caches.keys() : []; })
      .then(function (keys) { return Promise.all(keys.filter(function (k) { return k !== 'mahami-actions'; }).map(function (k) { return caches.delete(k); })); })
      .finally(function () { location.reload(); });
  })();
</script>
</body>
</html>
